name: Sync upstream
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: git remote add upstream https://github.com/The-Anomalist/Singularity.git
      - run: git fetch upstream Evolved
      - run: git merge upstream/Evolved --no-edit
      - run: git push origin Evolved
