name: Sync upstream
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Sync Singularity (Evolved)
        run: |
          git remote add upstream https://github.com/The-Anomalist/Singularity.git 2>/dev/null || git remote set-url upstream https://github.com/The-Anomalist/Singularity.git
          git fetch upstream Evolved
          git merge upstream/Evolved --no-edit
      - run: git push origin Evolved
