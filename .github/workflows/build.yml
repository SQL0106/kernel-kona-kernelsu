name: Build Singularity Kernel

on:
  push:
    branches: ["Evolved"]
    paths-ignore:
      - "*.md"
      - "Documentation/**"
  workflow_dispatch:

env:
  ARCH: arm64
  CLANG_ROOT: /opt/clang
  CCACHE_DIR: ~/.ccache
  CCACHE_MAXSIZE: 5G

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache flex bison bc build-essential \
            libssl-dev libelf-dev python3 python3-pip cpio kmod

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref }}-
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache -M ${CCACHE_MAXSIZE}
          ccache -z

      - name: Download Google clang-r416183b
        run: |
          mkdir -p /tmp/clang-dl
          curl -sL \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/b669748458572622ed716407611633c5415da25c/clang-r416183b.tar.gz" \
            -o /tmp/clang-dl/clang-r416183b.tar.gz
          sudo mkdir -p ${CLANG_ROOT}
          sudo tar xzf /tmp/clang-dl/clang-r416183b.tar.gz -C ${CLANG_ROOT}
          sudo rm -rf /tmp/clang-dl
          ${CLANG_ROOT}/bin/clang --version

      - name: Build kernel
        run: |
          export PATH="${CLANG_ROOT}/bin:${PATH}"
          export CC="ccache clang"
          export CXX="ccache clang++"
          export HOSTCC="ccache clang"
          export HOSTCXX="ccache clang++"
          bash scripts/build-kernel.sh

      - name: Show ccache stats
        run: ccache -s

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp out/arch/arm64/boot/Image ak3/Image
          cat > ak3/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ## AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=Singularity Kernel for OnePlus 8 (kona) by The-Anomalist
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=instantnoodle
          device.name2=instantnoodlep
          device.name3=kebab
          device.name4=lemonades
          device.name5=OnePlus8
          device.name6=OnePlus8Pro
          device.name7=OnePlus8T
          device.name8=OnePlus9R
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          # shell variables
          block=boot;
          is_slot_device=1;
          ramdisk_compression=auto;

          ## AnyKernel methods (DO NOT CHANGE)
          # import patching functions/variables - see for reference
          . tools/ak3-core.sh;

          ## AnyKernel install
          dump_boot;

          write_boot;
          ## end install
          EOF
          SHA_SHORT=${GITHUB_SHA:0:7}
          cd ak3 && zip -r9 "../Singularity-kona-${SHA_SHORT}.zip" . -x "*.git*" && cd ..
          ls -lh Singularity-kona-*.zip

      - name: Upload AK3 zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ak3-zip
          path: Singularity-kona-*.zip
          if-no-files-found: warn

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-dtbo
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dts/qcom/*.dtb

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build.log
